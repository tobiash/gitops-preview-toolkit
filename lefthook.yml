# Lefthook configuration for gitops-preview-toolkit
# Install hooks with: lefthook install

pre-commit:
  parallel: true
  commands:
    gofmt:
      glob: "*.go"
      run: gofmt -s -w {staged_files}
      stage_fixed: true
    govet:
      glob: "*.go"
      run: go vet ./...
    go-mod-tidy:
      glob: "*.{go,mod}"
      run: go mod tidy && git diff --exit-code go.mod go.sum
    golangci-lint:
      glob: "*.go"
      run: golangci-lint run --new-from-rev HEAD --fix ./...
      stage_fixed: true
    secretlint:
      glob: "*"
      run: npx --no-install secretlint --secretlintrc .secretlintrc.json {staged_files}
    fmp-policy:
      # Run fmp policy checks when .fmp.yaml has policies configured.
      # Compares HEAD against the staged index so only staged changes are evaluated.
      run: |
        if [ ! -f .fmp.yaml ] || ! grep -q "policies:" .fmp.yaml; then
          exit 0
        fi
        if ! command -v fmp >/dev/null 2>&1; then
          echo "warning: fmp not found in PATH, skipping policy check" >&2
          exit 0
        fi
        head_tree=$(git rev-parse HEAD^{tree})
        staged_tree=$(git write-tree)
        fmp diff "git:${head_tree}" "git:${staged_tree}" --summary-only

pre-push:
  commands:
    test:
      run: env -u GIT_DIR -u GIT_WORK_TREE -u GIT_INDEX_FILE go test ./...
    lint:
      run: golangci-lint run ./...
    verify-action-bundle:
      run: |
        npm run build
        git diff --exit-code dist
    action-cli-integration:
      run: |
        set -euo pipefail
        bundle=$(mktemp -d)
        trap 'rm -rf "$bundle"' EXIT
        for binary in fmp gitops-preview gitops-preview-flux gitops-preview-crossplane; do
          go build -buildvcs=false -o "$bundle/$binary" "./cmd/$binary"
        done
        tmp_fmp="$bundle/fmp"

        "$tmp_fmp" test tests/action -k clusters/kube --render-helm=false -q
        if "$tmp_fmp" test /tmp/does-not-exist -k nonexistent --render-helm=false -q 2>/dev/null; then
          echo "ERROR: fmp test should have failed for nonexistent path"
          exit 1
        fi

        output=$("$tmp_fmp" render tests/action -k apps/podinfo --render-helm=false -q -s)
        echo "$output" | grep -q "^apiVersion" || { echo "Missing apiVersion"; exit 1; }
        echo "$output" | grep -q "kind: ConfigMap" || { echo "Missing ConfigMap kind"; exit 1; }
        echo "$output" | grep -q "name: podinfo-config" || { echo "Missing resource name"; exit 1; }

        output2=$("$tmp_fmp" render tests/action -k apps/podinfo --render-helm=false -q -s)
        if [ "$output" != "$output2" ]; then
          echo "ERROR: sorted output is not deterministic"
          exit 1
        fi
