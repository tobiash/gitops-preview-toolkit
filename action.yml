name: 'gitops-preview-toolkit'
description: 'Render and diff GitOps manifests through Flux and optional Crossplane plugins with reports and PR comments'

inputs:
  binary:
    description: 'Path to an existing gitops-preview or fmp executable; install sibling render plugins for local or non-release testing'
    required: false
    default: ''
  repo:
    description: 'Path to the repository checkout (must be a git worktree with full history)'
    required: false
    default: '.'
  base-ref:
    description: 'Git ref to diff against (e.g. origin/main, HEAD~1). Defaults to origin/main or main.'
    required: false
    default: ''
  base-sha:
    description: 'Exact SHA to diff against. Overrides base-ref when set.'
    required: false
    default: ''
  paths:
    description: 'Kustomize bases or directories to render (newline-separated, relative to repo root). Supports cluster:path prefixes for multi-cluster mode.'
    required: false
    default: ''
  clusters:
    description: 'Explicit cluster mappings (newline-separated, format: cluster:path). Merged with prefixed paths entries.'
    required: false
    default: ''
  recursive:
    description: 'Recursively discover all paths under each directory'
    required: false
    default: 'false'
  helm:
    description: 'Enable Helm rendering'
    required: false
    default: 'true'
  resolve-git:
    description: 'Clone and follow external GitRepository sources'
    required: false
    default: 'false'
  crossplane:
    description: 'Trusted opt-in to Crossplane rendering and composition function execution (Docker by default)'
    required: false
    default: 'false'
  crossplane-engine:
    description: 'Trusted path to the external Crossplane v2.4.2 engine (default: crossplane-core on PATH)'
    required: false
    default: ''
  crossplane-function:
    description: 'Trusted development targets, newline-separated function=host:port entries'
    required: false
    default: ''
  flux-plugin:
    description: 'Trusted Flux plugin executable override'
    required: false
    default: ''
  crossplane-plugin:
    description: 'Trusted Crossplane plugin executable override (requires crossplane: true)'
    required: false
    default: ''
  sort:
    description: 'Sort output for deterministic diffs'
    required: false
    default: 'false'
  exclude-crds:
    description: 'Strip CustomResourceDefinitions from output'
    required: false
    default: 'false'
  helm-release:
    description: 'Filter diff to a specific HelmRelease by name'
    required: false
    default: ''
  config:
    description: 'Explicit config path (auto-discovers .gitops-preview.yaml, with .fmp.yaml compatibility)'
    required: false
    default: ''
  filter-file:
    description: 'Path to a KIO filters definition file'
    required: false
    default: ''
  filter-yaml:
    description: 'Raw KIO filters YAML string'
    required: false
    default: ''
  registry-config:
    description: 'Helm registry config path'
    required: false
    default: ''
  repository-config:
    description: 'Helm repository config path'
    required: false
    default: ''
  repository-cache:
    description: 'Helm repository cache path'
    required: false
    default: ''
  export-dir:
    description: 'Export rendered manifests to this directory'
    required: false
    default: ''
  export-changed-only:
    description: 'Only export manifests that have changed'
    required: false
    default: 'false'
  write-summary:
    description: 'Write a step summary'
    required: false
    default: 'true'
  comment:
    description: 'Post/update a sticky PR comment'
    required: false
    default: 'false'
  comment-mode:
    description: 'When to comment: changes, always, failure'
    required: false
    default: 'changes'
  github-token:
    description: 'Token for PR comments'
    required: false
    default: ${{ github.token }}
  max-inline-diff-bytes:
    description: 'Max diff bytes to inline in comments/summaries'
    required: false
    default: '50000'
  diff-preview-lines:
    description: 'Max diff lines to show in previews'
    required: false
    default: '200'
  html-report:
    description: 'Generate and upload a rich HTML report artifact with resource browser and detailed diffs'
    required: false
    default: 'false'
  html-report-name:
    description: 'Name of the uploaded HTML report artifact'
    required: false
    default: 'flux-manifest-preview-report'
  html-report-retention-days:
    description: 'Retention period in days for the HTML report artifact'
    required: false
    default: '7'
  html-report-max-resource-diff-bytes:
    description: 'Maximum bytes of per-resource diff content embedded in the HTML report'
    required: false
    default: '2000000'
  html-report-pages:
    description: 'Deploy the HTML report to GitHub Pages (requires Pages enabled on gh-pages branch)'
    required: false
    default: 'false'
  html-report-pages-path:
    description: 'Subdirectory on the gh-pages branch to deploy reports to'
    required: false
    default: 'fmp-reports'
  ai-assessment:
    description: 'Enable optional AI assessment; empty inherits repository ai.enabled'
    required: false
    default: ''
  ai-provider:
    description: 'AI provider override: openai, anthropic, zai, minimax, or openrouter'
    required: false
    default: ''
  ai-model:
    description: 'AI model override'
    required: false
    default: ''
  ai-fail-on-error:
    description: 'Fail when AI assessment cannot be generated; empty inherits repository ai.fail-on-error'
    required: false
    default: ''
  fail-on-warning:
    description: 'Fail the step on warnings'
    required: false
    default: 'false'
  fail-on-error:
    description: 'Fail the step on errors'
    required: false
    default: 'true'
  repo-a:
    description: 'Path to the base repository checkout'
    required: false
    default: ''
  repo-b:
    description: 'Path to the target repository checkout'
    required: false
    default: ''
  kustomizations:
    description: 'Kustomize bases to render (newline-separated, relative to repo path)'
    required: false
    default: ''

outputs:
  status:
    description: 'Overall status: clean, changed, warning, error'
  changed:
    description: 'Whether manifest changes were detected'
  warnings-count:
    description: 'Number of warnings'
  errors-count:
    description: 'Number of errors'
  resources-added:
    description: 'Number of added resources'
  resources-modified:
    description: 'Number of modified resources'
  resources-deleted:
    description: 'Number of deleted resources'
  resources-total:
    description: 'Total number of changed resources'
  diff-bytes:
    description: 'Size of the full diff in bytes'
  diff-truncated:
    description: 'Whether the inline diff was truncated'
  diff-file:
    description: 'Path to the full diff file'
  summary-file:
    description: 'Path to the summary markdown file'
  comment-file:
    description: 'Path to the comment markdown file'
  report-file:
    description: 'Path to the structured JSON report'
  html-report-file:
    description: 'Path to the generated HTML report index file'
  html-report-artifact:
    description: 'Name of the uploaded HTML report artifact'
  html-report-url:
    description: 'Direct URL to the interactive HTML report (GitHub Pages or artifact)'
  export-dir:
    description: 'Directory where rendered manifests were exported'
  classifications-json:
    description: 'JSON array of matched classifications with provenance'
  violations-json:
    description: 'JSON array of matched policy violations'
  labels-json:
    description: 'JSON array of suggested/applied pull request labels'
  policy-failed:
    description: 'Whether a configured fail-on policy matched'
  ai-assessment-json:
    description: 'JSON object for the AI assessment when generated'
  ai-summary:
    description: 'AI-generated summary when generated'

runs:
  using: 'node24'
  main: 'dist/index.js'
