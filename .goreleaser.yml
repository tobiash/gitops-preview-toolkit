version: 2

dist: .goreleaser-dist

builds:
  - id: fmp
    main: ./cmd/fmp
    binary: fmp
    ldflags:
      - -s -w -X main.version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    hooks:
      post:
        - cmd: 'sh -c "if [ \"{{ .Os }}\" = \"linux\" ]; then upx -9 \"{{ .Path }}\"; fi"'
          output: true
  - id: gitops-preview
    main: ./cmd/gitops-preview
    binary: gitops-preview
    ldflags:
      - -s -w -X main.version={{.Version}}
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: gitops-preview-flux
    main: ./cmd/gitops-preview-flux
    binary: gitops-preview-flux
    ldflags: [-s -w]
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: gitops-preview-crossplane
    main: ./cmd/gitops-preview-crossplane
    binary: gitops-preview-crossplane
    ldflags: [-s -w]
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: fmp
    ids:
      - fmp
      - gitops-preview-flux
      - gitops-preview-crossplane
    name_template: "fmp_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
  - id: gitops-preview-toolkit
    ids:
      - gitops-preview
      - fmp
      - gitops-preview-flux
      - gitops-preview-crossplane
    name_template: "gitops-preview-toolkit_{{ .Tag }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: tobiash
    name: gitops-preview-toolkit
  prerelease: auto
