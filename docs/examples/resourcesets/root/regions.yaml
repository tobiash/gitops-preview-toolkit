apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: regional-workloads
  namespace: flux-system
spec:
  inputs:
    - region: eu-west-1
      namespace: apps-eu-west-1
    - region: us-east-1
      namespace: apps-us-east-1
  resourcesTemplate: |
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: workloads-<< inputs.region >>
      namespace: flux-system
    spec:
      interval: 5m
      path: ./workloads/<< inputs.region >>
      prune: true
      targetNamespace: << inputs.namespace >>
      sourceRef:
        kind: GitRepository
        name: local
