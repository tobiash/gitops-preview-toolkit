apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: example-repo
  namespace: flux-system
spec:
  interval: 1m
  url: ./
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-root
  namespace: flux-system
spec:
  interval: 1m
  path: ./environments/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: example-repo
