apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xplatforms.platform.example.org
spec:
  scope: Namespaced
  group: platform.example.org
  names:
    kind: XPlatform
    plural: xplatforms
  defaultCompositionRef:
    name: platform
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [config]
              properties:
                config:
                  type: object
                  required: [environment, image, replicas, size, dbInstanceClass, storage, cacheGiB, expose, host, logs, debug]
                  properties:
                    environment: {type: string, enum: [staging, production]}
                    image: {type: string}
                    replicas: {type: integer, minimum: 1}
                    size: {type: string, enum: [small, medium]}
                    dbInstanceClass: {type: string}
                    storage: {type: integer, minimum: 20}
                    cacheGiB: {type: integer, minimum: 1}
                    expose: {type: boolean}
                    host: {type: string}
                    logs: {type: boolean}
                    debug: {type: boolean}
---
