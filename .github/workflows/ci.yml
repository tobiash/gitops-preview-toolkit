name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify bundled action output
        run: |
          npm ci
          npm run build
          git diff --exit-code dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Unformatted files:"
            gofmt -s -l .
            exit 1
          fi
      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Run go vet
        run: go vet ./...
      - name: Run tests
        run: go test ./...
      - name: Build toolkit and compatibility binary
        run: |
          go build -o "$RUNNER_TEMP/toolkit/" ./cmd/fmp ./cmd/gitops-preview ./cmd/gitops-preview-flux ./cmd/gitops-preview-crossplane
          for binary in fmp gitops-preview gitops-preview-flux gitops-preview-crossplane; do
            test -x "$RUNNER_TEMP/toolkit/$binary"
          done

  plugin-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run transport, host and renderer integration race tests
        run: go test -race -tags=integration ./pkg/plugin ./pkg/pluginhost ./pkg/fluxrender ./pkg/crossplanerender -count=1 -timeout=5m

  plugins-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: Prepare isolated live-test workspace
        run: mkdir -p /tmp/opencode
      - name: Run real Crossplane function and plugin chain (no Docker)
        run: bash tests/plugins/run-live.sh
