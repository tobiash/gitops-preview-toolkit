name: Action Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "action.yml"
      - ".github/workflows/test-action.yml"
      - "src/**"
      - "dist/**"
      - "package.json"
      - "package-lock.json"
      - "tests/action/**"
      - "cmd/**"
      - "internal/cli/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile.action"

concurrency:
  group: action-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-custom-binary:
    name: Test action (custom binary)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Simulate a PR diff by comparing the repo against itself.
      # The "base" is the test fixture, the "target" is the same
      # fixture with a modified value — produces a real diff.
      - name: Prepare test repos
        run: |
          cp -r tests/action /tmp/repo-a
          cp -r tests/action /tmp/repo-b
          # Modify a value in repo-b so the diff is non-empty
          sed -i 's/color: blue/color: green/' /tmp/repo-b/apps/podinfo/configmap.yaml

      - name: Build toolkit and compatibility binary
        run: |
          go build -trimpath -ldflags="-s -w" -o /tmp/ ./cmd/fmp ./cmd/gitops-preview ./cmd/gitops-preview-flux ./cmd/gitops-preview-crossplane
          for binary in fmp gitops-preview gitops-preview-flux gitops-preview-crossplane; do
            test -x "/tmp/$binary"
          done

      - name: Run gitops-preview-toolkit with fmp compatibility binary
        id: fmp
        uses: ./
        with:
          binary: /tmp/fmp
          repo-a: /tmp/repo-a
          repo-b: /tmp/repo-b
          kustomizations: |
            clusters/kube
          helm: "false"
          html-report: "true"

      - name: Verify outputs
        run: |
          echo "Status: ${{ steps.fmp.outputs.status }}"
          echo "Changed: ${{ steps.fmp.outputs.changed }}"
          echo "Resources total: ${{ steps.fmp.outputs.resources-total }}"

          if [ "${{ steps.fmp.outputs.changed }}" != "true" ]; then
            echo "ERROR: expected changed=true"
            exit 1
          fi

          if [ -z "${{ steps.fmp.outputs.diff-file }}" ]; then
            echo "ERROR: diff-file output is empty"
            exit 1
          fi

          if [ ! -f "${{ steps.fmp.outputs.diff-file }}" ]; then
            echo "ERROR: diff file does not exist"
            exit 1
          fi

          echo "Diff file: ${{ steps.fmp.outputs.diff-file }}"
          cat "${{ steps.fmp.outputs.diff-file }}" | grep -q "blue" || { echo "Missing 'blue' in diff"; exit 1; }
          cat "${{ steps.fmp.outputs.diff-file }}" | grep -q "green" || { echo "Missing 'green' in diff"; exit 1; }
          echo "Diff contains expected changes"

          if [ -z "${{ steps.fmp.outputs.summary-file }}" ]; then
            echo "ERROR: summary-file output is empty"
            exit 1
          fi
          echo "Summary file exists: ${{ steps.fmp.outputs.summary-file }}"

          if [ -z "${{ steps.fmp.outputs.report-file }}" ]; then
            echo "ERROR: report-file output is empty"
            exit 1
          fi
          echo "Report file exists: ${{ steps.fmp.outputs.report-file }}"

          if [ -z "${{ steps.fmp.outputs.html-report-file }}" ]; then
            echo "ERROR: html-report-file output is empty"
            exit 1
          fi
          if [ ! -f "${{ steps.fmp.outputs.html-report-file }}" ]; then
            echo "ERROR: html report file does not exist"
            exit 1
          fi
          grep -q "fmp-report-data" "${{ steps.fmp.outputs.html-report-file }}" || { echo "Missing embedded report data"; exit 1; }

  test-cli:
    name: Test toolkit and fmp CLI commands
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build toolkit and compatibility binary
        run: |
          go build -o /usr/local/bin/ ./cmd/fmp ./cmd/gitops-preview ./cmd/gitops-preview-flux ./cmd/gitops-preview-crossplane
          for binary in fmp gitops-preview gitops-preview-flux gitops-preview-crossplane; do
            test -x "/usr/local/bin/$binary"
          done
      - name: Check toolkit compatibility
        run: |
          gitops-preview version
          fmp version
          gitops-preview test tests/action -k clusters/kube --render-helm=false -q
      - name: Run fmp test (should pass)
        run: fmp test tests/action -k clusters/kube --render-helm=false -q
      - name: Run fmp test (should fail on broken path)
        run: |
          if fmp test /tmp/does-not-exist -k nonexistent --render-helm=false -q 2>/dev/null; then
            echo "ERROR: fmp test should have failed for nonexistent path"
            exit 1
          fi
          echo "Correctly failed for nonexistent path"
      - name: Render and verify sorted output
        run: |
          OUTPUT=$(fmp render tests/action -k apps/podinfo --render-helm=false -q -s)
          echo "$OUTPUT" | grep -q "^apiVersion" || { echo "Missing apiVersion"; exit 1; }
          echo "$OUTPUT" | grep -q "kind: ConfigMap" || { echo "Missing ConfigMap kind"; exit 1; }
          echo "$OUTPUT" | grep -q "name: podinfo-config" || { echo "Missing resource name"; exit 1; }

          # Verify deterministic order: run twice, expect identical output
          OUTPUT2=$(fmp render tests/action -k apps/podinfo --render-helm=false -q -s)
          if [ "$OUTPUT" != "$OUTPUT2" ]; then
            echo "ERROR: sorted output is not deterministic"
            exit 1
          fi
          echo "Sorted output is deterministic"

  test-docker-action:
    name: Test Docker action toolkit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Prepare test repos and reports
        run: |
          mkdir -p "$RUNNER_TEMP/docker-action/reports"
          cp -r tests/action "$RUNNER_TEMP/docker-action/repo-a"
          cp -r tests/action "$RUNNER_TEMP/docker-action/repo-b"
          sed -i 's/color: blue/color: green/' "$RUNNER_TEMP/docker-action/repo-b/apps/podinfo/configmap.yaml"
      - name: Build Docker action
        run: docker build -f Dockerfile.action -t gitops-preview-action:test .
      - name: Verify bundled executables
        run: |
          docker run --rm --entrypoint /bin/sh gitops-preview-action:test -c '
            for binary in fmp gitops-preview gitops-preview-flux gitops-preview-crossplane; do
              test -x "/usr/local/bin/$binary" || exit 1
            done'
          docker run --rm --entrypoint /usr/local/bin/fmp gitops-preview-action:test version
          docker run --rm --entrypoint /usr/local/bin/gitops-preview gitops-preview-action:test version
      - name: Run Docker action with sibling plugins
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/docker-action:/fixtures" \
            -e INPUT_REPO_A=/fixtures/repo-a \
            -e INPUT_REPO_B=/fixtures/repo-b \
            -e INPUT_PATHS=clusters/kube \
            -e INPUT_HELM=false \
            -e RUNNER_TEMP=/fixtures/reports \
            gitops-preview-action:test
          test -f "$RUNNER_TEMP/docker-action/reports/fmp-report.json"
          grep -q 'blue' "$RUNNER_TEMP/docker-action/reports/fmp-diff.txt"
          grep -q 'green' "$RUNNER_TEMP/docker-action/reports/fmp-diff.txt"
