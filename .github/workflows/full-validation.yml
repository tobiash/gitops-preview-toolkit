name: Full Validation

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: full-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify bundled action output
        run: |
          npm ci
          npm run build
          git diff --exit-code dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Unformatted files:"
            gofmt -s -l .
            exit 1
          fi
      - name: Verify go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Run go vet
        run: go vet ./...
      - name: Run race tests
        run: go test -race ./...
      - name: Run transport, host and renderer integration race tests
        run: go test -race -tags=integration ./pkg/plugin ./pkg/pluginhost ./pkg/fluxrender ./pkg/crossplanerender -count=1 -timeout=5m
      - name: Cross-compile Linux arm64
        run: |
          GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/toolkit-arm64/" ./cmd/fmp ./cmd/gitops-preview ./cmd/gitops-preview-flux ./cmd/gitops-preview-crossplane
          for binary in fmp gitops-preview gitops-preview-flux gitops-preview-crossplane; do
            test -x "$RUNNER_TEMP/toolkit-arm64/$binary"
          done

  plugins-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: true
      - name: Prepare isolated live-test workspace
        run: mkdir -p /tmp/opencode
      - name: Run real Crossplane function and plugin chain (no Docker)
        run: bash tests/plugins/run-live.sh

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify bundled action output
        run: |
          npm ci
          npm run build
          git diff --exit-code dist
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m
      - name: Cache govulncheck DB
        uses: actions/cache@v5
        with:
          path: ~/.cache/govulncheck
          key: govulncheck-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: govulncheck-db-${{ runner.os }}-
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
